name: Build
run-name: "Build | #${{ github.run_number }}${{ github.event_name == 'schedule' && ' [Scheduled]' || (github.event_name == 'pull_request' && ' [PullRequest]' || '') }}"

on:
  push:
    branches: [ master ]
  schedule:
    # Sunday 07:00 Europe/Prague
    - cron: '0 7 * * 0'
      timezone: "Europe/Prague"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        path: s
        #ref: ${{ (github.event_name == 'schedule' && inputs.scheduled-build-ref) || '' }} # scheduled build always checks out the main branch (default)

    - name: Create artifacts folder
      run: mkdir a

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4

    - name: Restore dependencies
      working-directory: s/src
      run: nuget restore Havit.CastleWindsor.WebForms.sln

    - name: Build solution
      working-directory: s/src
      run: msbuild Havit.CastleWindsor.WebForms.sln /p:Configuration=Release /p:ContinuousIntegrationBuild=true /p:PublishDirectory=${{ github.workspace }}/a

    - name: Upload artifacts - PublicNuGets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: PublicNuGets
        path: a/PublicNuGets/*.nupkg
        compression-level: 0 
        if-no-files-found: error
